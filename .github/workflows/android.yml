name: Build Trip Friend Android
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed APK as a GitHub release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'android-shell.*'
      - 'scripts/prepare-android.mjs'
      - 'release.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Prepare Android app
        env:
          GOOGLE_SERVICES: ${{ secrets.TRIP_FRIEND_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > google-services.json; fi
          npm run android:prepare
          npx cap add android
          npm run android:prepare
          npx cap sync android
      - name: Build test APK and release packages
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Sign and verify release packages
        if: inputs.publish
        env:
          KEYSTORE: ${{ secrets.TRIP_FRIEND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRIP_FRIEND_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TRIP_FRIEND_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRIP_FRIEND_KEY_ALIAS }}
        run: |
          set -eu
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tripfriend.jks"
          trap 'rm -f "$RUNNER_TEMP/tripfriend.jks"' EXIT
          mkdir -p dist
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/tripfriend.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist/TripFriend.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify dist/TripFriend.apk
          jarsigner -keystore "$RUNNER_TEMP/tripfriend.jks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -signedjar dist/TripFriend.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify dist/TripFriend.aab
      - uses: actions/upload-artifact@v4
        with:
          name: TripFriend-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: TripFriend-signed
          path: dist/
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TripFriend-signed
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./release.json').version")
          gh release create "v${version}" dist/TripFriend.apk dist/TripFriend.aab --target "$GITHUB_SHA" --title "Trip Friend v${version}" --generate-notes
